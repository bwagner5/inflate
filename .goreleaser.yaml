# GoReleaser configuration. Tagged releases are published by GitHub Actions;
# use `make release-snapshot` to exercise the same build locally.
version: 2

builds:
  - id: inflate
    main: ./cmd
    binary: inflate
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

nfpms:
  - id: packages
    package_name: inflate
    maintainer: Brandon Wagner
    description: Kubernetes workloads for scheduling and autoscaling demos
    license: Apache-2.0
    formats:
      - deb
      - rpm

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
